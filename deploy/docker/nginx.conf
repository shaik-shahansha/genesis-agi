# Genesis Minds — single front door.
#
# Serves the web workspace at / and the Genesis API at /api, on ONE port.
# Running unprivileged: all writable paths are redirected to /tmp/nginx.

worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log WITHOUT the query string.
    #
    # WebSocket clients authenticate with ?token=<jwt> because browsers cannot set
    # headers on a WebSocket handshake. Logging the full request would write live
    # credentials into the container logs, so $request_uri ($uri + $args) is
    # deliberately not used here.
    log_format genesis '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status '
                       '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout genesis;

    # nginx cannot write to /var/lib/nginx as a non-root user.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Workspace uploads / generated artifacts can be large.
    client_max_body_size 512m;

    # WebSocket upgrade handling (chat stream + environment streams).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream genesis_api {
        server 127.0.0.1:8000;
    }

    upstream genesis_web {
        server 127.0.0.1:3000;
    }

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Long-lived cognition turns and streaming responses.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 15s;

        # ---- Genesis API (HTTP + WebSocket) ------------------------------
        location /api/ {
            proxy_pass http://genesis_api;

            # Required for WebSocket endpoints under /api/v1/...
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Never buffer: streaming chat and proactive pushes must flow.
            proxy_buffering off;
            proxy_cache off;
        }

        # ---- API auxiliary endpoints -------------------------------------
        location = /health        { proxy_pass http://genesis_api; }
        location = /docs          { proxy_pass http://genesis_api; }
        location = /redoc         { proxy_pass http://genesis_api; }
        location = /openapi.json  { proxy_pass http://genesis_api; }

        # Static assets mounted by the API (avatars, generated images).
        location /avatars/   { proxy_pass http://genesis_api; }
        location /generated/ { proxy_pass http://genesis_api; }

        # ---- Web workspace (catch-all) -----------------------------------
        location / {
            proxy_pass http://genesis_web;
        }
    }
}
